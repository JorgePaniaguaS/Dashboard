<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Personal de Productividad</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Fuentes de Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="dashboard-container">
    
    <!-- ENCABEZADO: Saludo y Reloj Digital -->
    <header class="header-card">
      <div class="greeting-box">
        <h1 id="greeting">¡Hola!</h1>
        <p id="date-display">Cargando fecha...</p>
      </div>
      <div class="clock-box">
        <span id="clock">00:00:00</span>
      </div>
    </header>

    <!-- TARJETA DEL CLIMA EN VIVO -->
    <section class="weather-card">
      <h2>Clima en vivo</h2>
      <div class="weather-search">
        <input type="text" id="city-input" placeholder="Ingresa tu ciudad (ej. Bogota, Madrid)">
        <button id="search-weather-btn">Buscar</button>
      </div>
      <div id="weather-info" class="weather-info">
        <p class="weather-placeholder">Ingresa una ciudad para cargar el clima.</p>
      </div>
    </section>

    <!-- TARJETA DE FRASE MOTIVACIONAL -->
    <section class="quote-card">
      <blockquote id="quote-text">"El único modo de hacer un gran trabajo es amar lo que haces."</blockquote>
      <cite id="quote-author">- Steve Jobs</cite>
    </section>

    <!-- TARJETA DE LISTA DE TAREAS (TO-DO LIST) -->
    <section class="todo-card">
      <h2>Lista de Tareas Pendientes</h2>
      <form id="todo-form">
        <input type="text" id="todo-input" placeholder="¿Qué tienes pendiente hoy?" required>
        <button type="submit">Agregar</button>
      </form>
      
      <div class="todo-stats">
        <span id="tasks-counter">0 tareas pendientes</span>
        <button id="clear-completed-btn" class="btn-secondary">Limpiar completadas</button>
      </div>

      <ul id="todo-list" class="todo-list">
        <!-- Las tareas se insertarán dinámicamente con JavaScript -->
      </ul>
    </section>

  </div>

  <!-- Enlace al archivo de JavaScript -->
  <script src="app.js"></script>
</body>
</html>
